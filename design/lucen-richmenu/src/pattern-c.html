<!doctype html>
<meta charset="utf-8">
<title>LUCEN rich menu / C - Typographic</title>
<link rel="stylesheet" href="base.css">
<style>
  /* C案 : Typographic
     アイコンは極小のマークに留め、文字組みと余白だけで見せる型。
     いちばん静かで、ジュエリーブランドらしい上質さが出る。 */

  body, .menu { background: var(--white); }

  /* セルを分ける細いヘアライン（上下は余白を残して短く） */
  .menu::before, .menu::after {
    content: ""; position: absolute; top: 168px; bottom: 168px;
    width: 1.5px; background: var(--line);
  }
  .menu::before { left: 833px; }
  .menu::after  { left: 1667px; }

  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .icon { width: 78px; height: 78px; }
  .icon--char { width: 96px; height: 96px; }
  .ic-line { stroke-width: 5.5; }
  .ic-line, .ic-face { color: var(--ink); }
  .ic-detail { color: var(--white); }

  .name {
    font-size: 74px; font-weight: 300; line-height: 1;
    letter-spacing: .16em; text-indent: .16em;
    color: var(--ink); margin-top: 58px;
  }
  .rule {
    width: 88px; height: 1.5px; background: var(--line);
    margin-top: 48px;
  }
  .en {
    font-size: 23px; font-weight: 400;
    letter-spacing: .52em; text-indent: .52em;
    color: var(--grey); margin-top: 42px;
  }
</style>

<div class="menu">

  <!-- 左：LUCEN通販 -->
  <div class="cell">
    <div class="icon" data-icon="bagLine"></div>
    <div class="name">LUCEN通販</div>
    <div class="rule"></div>
    <div class="en">Online Store</div>
  </div>

  <!-- 中央：なんでも相談（AIキャラクターが自動応答） -->
  <div class="cell">
    <div class="icon icon--char" data-icon="charFlat"></div>
    <div class="name">なんでも相談</div>
    <div class="rule"></div>
    <div class="en">AI Concierge</div>
  </div>

  <!-- 右：マイページ -->
  <div class="cell">
    <div class="icon" data-icon="memberLine"></div>
    <div class="name">マイページ</div>
    <div class="rule"></div>
    <div class="en">My Page</div>
  </div>

</div>
<script src="icons.js"></script>
