<!doctype html>
<meta charset="utf-8">
<title>LUCEN rich menu / B - Panel</title>
<link rel="stylesheet" href="base.css">
<style>
  /* B案 : Panel
     カードを使わず、面を3分割して中央だけ黒ベタに反転。
     余白と線画で構成した、いちばんコントラストの強い型。AI相談が主役になる。 */

  body, .menu { background: var(--white); }

  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .cell--invert { background: var(--ink); }

  .icon { width: 196px; height: 196px; }
  .ic-line { stroke-width: 3.4; }

  .cell--light .ic-line,
  .cell--light .ic-face   { color: var(--ink);   }
  .cell--invert .ic-face  { color: var(--white); }
  .cell--invert .ic-detail{ color: var(--ink);   }

  .en {
    font-size: 24px; font-weight: 400;
    letter-spacing: .46em; text-indent: .46em;
    margin-top: 58px;
  }
  .name {
    font-size: 62px; font-weight: 500; line-height: 1;
    letter-spacing: .1em; text-indent: .1em;
    margin-top: 34px;
  }

  .cell--light  .en   { color: var(--grey); }
  .cell--light  .name { color: var(--ink);  }
  .cell--invert .en   { color: rgba(255,255,255,.55); }
  .cell--invert .name { color: var(--white); }
</style>

<div class="menu">

  <!-- 左：LUCEN通販 -->
  <div class="cell cell--light">
    <div class="icon" data-icon="bagLine"></div>
    <div class="en">Online Store</div>
    <div class="name">LUCEN通販</div>
  </div>

  <!-- 中央：なんでも相談（AIキャラクターが自動応答） -->
  <div class="cell cell--invert">
    <div class="icon" data-icon="charFlat"></div>
    <div class="en">AI Concierge</div>
    <div class="name">なんでも相談</div>
  </div>

  <!-- 右：マイページ -->
  <div class="cell cell--light">
    <div class="icon" data-icon="memberLine"></div>
    <div class="en">My Page</div>
    <div class="name">マイページ</div>
  </div>

</div>
<script src="icons.js"></script>
